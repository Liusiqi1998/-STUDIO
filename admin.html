<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核樂不煩 · STUDIO 管理后台</title>
<style>
:root{
  --ink:#161513; --ink2:#4A4642; --ink3:#8E8A84; --ink4:#B5B1AA;
  --line:#E7E4DE; --line2:#F1EFEB; --bg:#F7F6F3; --card:#FFFFFF;
  --red:#9E3327; --amber:#8A6A2F; --green:#2F6B4F;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:13px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);outline:none}
::selection{background:rgba(158,51,39,.14)}

/* ---------- 登录 ---------- */
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#141311;z-index:50}
.login::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(158,51,39,.16),transparent 55%)}
.lg-card{position:relative;width:380px;background:#fff;border-radius:16px;padding:40px 36px 32px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.lg-brand{font-size:17px;letter-spacing:1px;font-weight:500}
.lg-sub{font-size:11.5px;color:var(--ink3);margin-top:7px;letter-spacing:.5px}
.lg-field{margin-top:18px}
.lg-field label{display:block;font-size:11px;color:var(--ink3);margin-bottom:7px;letter-spacing:.5px}
.lg-field input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;
  padding:0 13px;background:#FBFAF8;transition:border-color .15s}
.lg-field input:focus{border-color:var(--ink);background:#fff}
.lg-btn{width:100%;height:44px;margin-top:24px;border:0;border-radius:9px;
  background:var(--ink);color:#fff;font-size:13.5px;letter-spacing:3px}
.lg-btn:hover{background:#000}
.lg-err{color:var(--red);font-size:11.5px;margin-top:12px;min-height:16px}
.lg-hint{margin-top:22px;padding-top:16px;border-top:1px solid var(--line2);
  font-size:11px;color:var(--ink3);line-height:1.9}
.lg-hint b{color:var(--ink2);font-weight:400}

/* ---------- 框架 ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:212px;flex-shrink:0;background:#161513;display:flex;flex-direction:column;padding:22px 0 16px}
.side-brand{padding:0 20px 22px;color:#fff}
.side-brand b{display:block;font-size:14px;font-weight:500;letter-spacing:.8px}
.side-brand span{display:block;font-size:10px;color:rgba(255,255,255,.4);margin-top:6px;letter-spacing:1.5px}
.nav{flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 14px;margin:2px 10px;border-radius:8px;
  color:rgba(255,255,255,.58);font-size:13px;text-decoration:none;transition:.12s}
.nav a:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.05)}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a .ic{width:16px;display:flex;justify-content:center;opacity:.9}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.side-foot{padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.08);margin:0 10px}
.who{display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.who-t{color:#fff;font-size:12px;line-height:1.35}
.who-t span{display:block;font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.3px}
.logout{margin-left:auto;color:rgba(255,255,255,.4);font-size:11px;background:none;border:0;padding:4px}
.logout:hover{color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 26px;gap:14px}
.top h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.5px}
.top .crumb{font-size:11.5px;color:var(--ink4)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.pill{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.body{flex:1;overflow-y:auto;padding:22px 26px 40px}

/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line2)}
.card-h h2{font-size:13px;font-weight:500;margin:0}
.card-h .r{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px}
.stat .k{font-size:11.5px;color:var(--ink3);letter-spacing:.5px}
.stat .v{font-size:24px;margin-top:9px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink3);margin-left:4px;letter-spacing:0}
.stat .d{font-size:10.5px;color:var(--ink4);margin-top:7px}
.stat.alert .v{color:var(--red)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--ink3);font-weight:400;text-align:left;padding:11px 16px;
  background:#FBFAF8;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:12.5px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FCFBF9}
.num{font-variant-numeric:tabular-nums}
.money{color:var(--red);font-variant-numeric:tabular-nums}
.thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;background:#F0EFEC;display:block}
.wcell{display:flex;align-items:center;gap:11px}
.wcell .t{font-size:12.5px;line-height:1.4}
.wcell .m{font-size:10.5px;color:var(--ink4);margin-top:3px}

.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag.sale{background:#EDF4EF;color:var(--green)}
.tag.out{background:#F2F1EE;color:var(--ink3)}
.tag.draft{background:#FAF0E4;color:var(--amber)}
.tag.wait{background:#FBE9E7;color:var(--red)}
.tag.sent{background:#EDF0F5;color:#3A5175}
.tag.done{background:#EDF4EF;color:var(--green)}
.tag.cancel{background:#F2F1EE;color:var(--ink4)}

.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line);
  background:#fff;font-size:12px;color:var(--ink2);transition:.12s}
.btn:hover{border-color:var(--ink4);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.danger{color:var(--red);border-color:rgba(158,51,39,.28)}
.btn.danger:hover{background:#FBE9E7}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 12px;
  background:#fff;width:230px;font-size:12.5px}
.search:focus{border-color:var(--ink4)}
.tabs{display:flex;gap:2px;background:#F2F1EE;border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:6px;font-size:12px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toolbar .sp{margin-left:auto}
.empty-row{text-align:center;color:var(--ink4);padding:56px 0;font-size:12.5px}

.note-cell{max-width:200px;color:var(--ink2);line-height:1.5;font-size:11.5px}
.note-cell.empty{color:var(--ink4)}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(22,20,18,.4);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;background:#fff;z-index:61;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.28)}
.drawer.on{transform:none}
.dr-h{height:60px;flex-shrink:0;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:14px;font-weight:500}
.dr-h .x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--ink4);line-height:1;padding:6px}
.dr-h .x:hover{color:var(--ink)}
.dr-b{flex:1;overflow-y:auto;padding:20px 22px}
.dr-f{flex-shrink:0;padding:14px 22px 18px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:7px}
.field label em{color:var(--red);font-style:normal;margin-left:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;background:#FBFAF8;transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink4);background:#fff}
.field textarea{resize:vertical;line-height:1.7;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upbox{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
  color:var(--ink4);font-size:12px;background:#FBFAF8}
.upbox b{display:block;color:var(--ink2);font-weight:400;margin-bottom:5px;font-size:12.5px}
.thumbs{display:flex;gap:9px;margin-top:11px}
.thumbs img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.thumbs .add{width:64px;height:64px;border:1px dashed var(--line);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--ink4);font-size:20px}
.sect-t{font-size:11px;color:var(--ink3);letter-spacing:1px;margin:22px 0 12px;padding-top:16px;
  border-top:1px solid var(--line2)}
.sect-t:first-child{margin-top:0;padding-top:0;border:0}
.warnbox{background:#FAF0E4;border-radius:9px;padding:12px 14px;font-size:11.5px;
  color:var(--amber);line-height:1.7}

.toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,20px);background:#161513;
  color:#fff;font-size:12.5px;padding:10px 18px;border-radius:8px;opacity:0;
  transition:.2s;pointer-events:none;z-index:99;letter-spacing:.3px}
.toast.on{opacity:1;transform:translate(-50%,0)}

.role-hint{font-size:11.5px;color:var(--ink3);line-height:1.9;background:#FBFAF8;
  border:1px solid var(--line2);border-radius:9px;padding:14px 16px;margin-bottom:16px;max-width:920px}
.role-hint b{color:var(--ink2);font-weight:400}

/* ---------- 外观与配置 ---------- */
.cfg-wrap{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:16px;align-items:start}
.cfg-card{margin-bottom:14px}
.cfg-body{padding:16px 18px}
.cfg-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.cf{margin-bottom:14px;min-width:0}
.cf label{display:block;font-size:11px;color:var(--ink3);margin-bottom:7px;letter-spacing:.3px}
.cf label b{color:var(--ink2);font-weight:500}
.cf input:not([type]),.cf input[type=text],.cf textarea,.cf select{
  width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 11px;
  background:#FBFAF8;font-size:12.5px;transition:.12s}
.cf textarea{height:auto;padding:10px 11px;line-height:1.75;resize:vertical}
.cf input:focus,.cf textarea:focus{border-color:var(--ink);background:#fff}
.cf input[type=range]{width:100%;accent-color:#161513;height:18px;background:none;border:0;padding:0}
.cf-note{font-size:11px;color:var(--ink3);line-height:1.8;background:#FBFAF8;
  border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
.color-row{display:flex;align-items:center;gap:9px}
input[type=color]{width:38px;height:30px;padding:2px;border:1px solid var(--line);
  border-radius:7px;background:#fff;cursor:pointer}
.hex{font-size:11px;color:var(--ink3);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.preset{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;transition:.12s;background:#fff}
.preset:hover{border-color:var(--ink4)}
.preset.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sw-dots{display:flex;gap:3px;margin-bottom:8px}
.sw-dots i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.06)}
.p-name{font-size:11.5px}
.p-sub{font-size:10px;color:var(--ink4);margin-top:3px;line-height:1.4}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-b{flex:1;text-align:center;font-size:12px;padding:8px 0;color:var(--ink2);cursor:pointer;background:#fff}
.seg-b+.seg-b{border-left:1px solid var(--line)}
.seg-b.on{background:var(--ink);color:#fff}
.sw-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;height:34px;background:#fff}
.sw-t{flex:1;font-size:11.5px;color:var(--ink2)}
.sw{width:30px;height:17px;border-radius:9px;background:#DCD8D2;position:relative;cursor:pointer;
  transition:.15s;flex-shrink:0}
.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ink)}
.sw.on i{left:15px}
.cfg-prev{position:sticky;top:0}
.prev-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prev-hd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);font-size:11.5px}
.prev-hd .r{margin-left:auto;color:var(--ink4);font-size:10.5px}
.prev-tabs{display:flex;gap:6px;padding:9px 14px 0}
.pv-t{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:13px;
  padding:3px 11px;cursor:pointer;background:#fff}
.pv-t.on{background:var(--ink);border-color:var(--ink);color:#fff}
.prev-stage{height:648px;overflow:hidden;display:flex;justify-content:center;background:#EDEBE6}
.prev-stage iframe{width:375px;height:812px;border:0;transform:scale(.78);transform-origin:top center;flex-shrink:0}
.prev-ft{display:flex;gap:8px;padding:12px 14px 10px}
.prev-note{padding:0 14px 14px;font-size:10.5px;color:var(--ink4);line-height:1.75}
@media (max-width:1180px){
  .cfg-wrap{grid-template-columns:1fr}
  .cfg-prev{position:static}
  .presets{grid-template-columns:repeat(2,1fr)}
}

/* ---------- 页面管理 ---------- */
.pg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pg-t{height:30px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:#fff;
  font-size:12px;color:var(--ink2);transition:.12s}
.pg-t:hover{border-color:var(--ink4);color:var(--ink)}
.pg-t.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cf-tip{font-size:10.5px;color:var(--ink4);margin-top:6px;line-height:1.6}
.imgf{display:flex;gap:14px;align-items:flex-start}
.imgf-box{width:104px;height:132px;flex-shrink:0;border-radius:9px;border:1px solid var(--line);
  background:#FBFAF8;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:10.5px;color:var(--ink4)}
.imgf-box img{width:100%;height:100%;object-fit:cover;display:block}
.imgf-act{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.imgf-act .btn{align-self:flex-start}
.asset-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.asset-pick{width:26px;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line);
  cursor:pointer;padding:0;background:none}
.asset-pick:hover{border-color:var(--ink)}
.asset-pick img{width:100%;height:100%;object-fit:cover;display:block}
.qrow{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.qrow:last-child{border-bottom:0}
.qrow-img{width:46px;height:46px;border-radius:7px;overflow:hidden;position:relative;cursor:pointer;
  background:#F0EFEC;flex-shrink:0}
.qrow-img img{width:100%;height:100%;object-fit:cover;display:block}
.qrow-img em{position:absolute;inset:0;background:rgba(22,20,18,.55);color:#fff;font-size:9.5px;
  font-style:normal;display:flex;align-items:center;justify-content:center;opacity:0;transition:.12s}
.qrow-img:hover em{opacity:1}
.qrow input{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 9px;
  background:#FBFAF8;font-size:12px}
.qrow input:focus{border-color:var(--ink);background:#fff}
.qrow select{width:100%;height:28px;border:1px solid var(--line);border-radius:7px;padding:0 6px;
  background:#fff;font-size:11.5px;color:var(--ink2);margin-top:6px}
</style>
</head>
<body>

<div class="login" id="loginView">
  <div class="lg-card">
    <div class="lg-brand">核樂不煩 · STUDIO</div>
    <div class="lg-sub">管理后台 · 仅限授权账号</div>
    <div class="lg-field"><label>账号</label><input id="lgUser" type="text" placeholder="管理员账号" value="admin" autocomplete="off"></div>
    <div class="lg-field"><label>密码</label><input id="lgPwd" type="password" placeholder="请输入密码" autocomplete="off"></div>
    <div class="lg-err" id="lgErr"></div>
    <button class="lg-btn" onclick="doLogin()" id="lgBtn">登 录</button>
    <div class="lg-hint" id="lgHint">
      仅限管理员账号登录。
    </div>
  </div>
</div>

<div class="app" id="appView" style="display:none">
  <aside class="side">
    <div class="side-brand">
      <b>核樂不煩</b>
      <span>S T U D I O</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who">
        <div class="avatar" id="avt">刘</div>
        <div class="who-t"><span id="whoName" style="font-size:12px;color:#fff;margin:0">刘总</span><span id="whoRole">超级管理员</span></div>
        <button class="logout" onclick="doLogout()">退出</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle">概览</h1>
      <span class="crumb" id="pageCrumb"></span>
      <div class="top-r">
        <span class="pill" id="todayPill"></span>
      </div>
    </header>
    <div class="body" id="content"></div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dr-h"><h3 id="drTitle">编辑</h3><button class="x" onclick="closeDrawer()">×</button></div>
  <div class="dr-b" id="drBody"></div>
  <div class="dr-f" id="drFoot"></div>
</aside>
<div class="toast" id="toast"></div>
<input type="file" id="imgFile" accept="image/*" style="display:none" onchange="onImgFile(event)">

<script src="./cfg.js"></script>

var toastTimer;
function toast(m){
  var t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); },2000);
}

/* ==================== 登录 ==================== */

function setErr(m){ $('lgErr').textContent = m || ''; }

function doLogin(){
  var u = $('lgUser').value.trim(), p = $('lgPwd').value;
  if(!u){ setErr('请输入账号'); return; }
  if(!p){ setErr('请输入密码'); return; }
  var acc = ACCOUNTS.filter(function(a){ return a.user===u && a.pwd===p; })[0];
  if(!acc){ setErr('账号或密码不对'); return; }
  if(!acc.active){ setErr('这个账号已停用，请联系管理员'); return; }
  setErr('');
  afterLogin(acc);
}

function afterLogin(acc){
  S.user = acc;
  $('loginView').style.display = 'none';
  $('appView').style.display = 'flex';
  $('whoName').textContent = acc.name;
  $('whoRole').textContent = acc.role === '客服' ? '客服' : '店主 · 全部权限';
  $('avt').textContent = (acc.name.charAt(0) || '店').toUpperCase();
  buildNav();
  var h = (location.hash||'').replace('#','');
  go(ROLE_NAV[acc.role].indexOf(h) > -1 ? h : 'dash');
  loadLocalAll();
}

function saveWork(id){

  if(!t || !no || !p){ toast('标题、编号、价格必填'); return; }

  var story = $('f_story').value.trim();
  if(id){
    var w = WORKS.filter(function(x){ return x.id===id; })[0];
    w.t=t; w.no=no; w.p=p; w.cat=cat; w.spec=spec; w.status=st; w.story=story;

  toast('已创建，把这个账号密码发给' + n);

      if(a && a.length){ WORKS = a; return; }
    }catch(e){}

  /* 本机没有草稿（换了电脑/清了缓存），就用已发布的配置当基线 */
  if(REMOTE_CFG.works && REMOTE_CFG.works.length){ WORKS = REMOTE_CFG.works; }
}

}

  for(k in b) o[k] = (b[k] && typeof b[k]==='object' && !Array.isArray(b[k])) ? cfgMerge(a[k]||{}, b[k]) : b[k];
  return o;
}
function cfgClone(){ return JSON.parse(JSON.stringify(DEF_CFG)); }
function setPath(o,p,v){
  var a=p.split('.'), t=o, i;
  for(i=0;i<a.length-1;i++) t=t[a[i]];
  t[a[a.length-1]] = v;
}
function getPath(o,p){
  var a=p.split('.'), t=o, i;
  for(i=0;i<a.length;i++){ if(t===undefined) return undefined; t=t[a[i]]; }
  return t;
}
function loadCfg(){
  var raw=null;
  try{ raw = localStorage.getItem('gh_cfg'); }catch(e){}
  var base = null;
  if(raw){ try{ base = JSON.parse(raw); }catch(e){ base = null; } }
  if(!base && REMOTE_CFG.cfg) base = REMOTE_CFG.cfg;
  CFG_ED = cfgMerge(DEF_CFG, base);
}

/* ==================== 导出线上配置（网页版上线用） ==================== */
var REMOTE_CFG = (window.SITE_CFG && typeof window.SITE_CFG==='object') ? window.SITE_CFG : {};

function walkAtKeys(o, acc){
  if(o==null) return;
  if(typeof o==='string'){ if(o.charAt(0)==='@') acc[o.slice(1)] = 1; return; }
  if(typeof o!=='object') return;
  for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) walkAtKeys(o[k], acc); }
}
function buildCfgJs(){
  var keys = {};
  walkAtKeys(CFG_ED, keys);
  WORKS.forEach(function(w){ if(typeof w.img==='string' && w.img.charAt(0)==='@') keys[w.img.slice(1)] = 1; });

  var images = {}, miss = [];
  for(var k in keys){
    var url = null;
    try{ url = localStorage.getItem('gh_img_'+k); }catch(e){}
    if(!url && REMOTE_CFG.images) url = REMOTE_CFG.images[k] || null;
    if(url) images[k] = url;
    /* 只有长得像素材名的才算真缺图；抖音号这类以 @ 开头的文字不是图，跳过 */
    else if(/^[A-Za-z0-9_-]+$/.test(k)) miss.push(k);
  }

  var d = new Date();
  var stamp = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  var payload = {v:2, at:stamp, cfg:CFG_ED, works:WORKS, images:images};

  var head = '/* 核樂不煩 · STUDIO — 线上配置\n'
    + '   本文件由后台「导出配置」自动生成，请不要手工编辑。\n'
    + '   要改内容：回后台改 → 导出 → 覆盖这个文件 → 提交，网站即更新。\n'
    + '   生成时间：' + stamp + ' ｜ 作品 ' + WORKS.length + ' 件 ｜ 图 ' + Object.keys(images).length + ' 张\n'
    + '*/\n';
  return {text: head + 'window.SITE_CFG = ' + JSON.stringify(payload, null, 1) + ';\n', miss:miss};
}
function downloadText(name, text){
  var blob = new Blob([text], {type:'text/javascript;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 200);
}
function exportCfg(){
  var r = buildCfgJs();
  downloadText('cfg.js', r.text);
  var kb = Math.round(r.text.length/1024);
  if(r.miss.length){
    toast('已生成发布文件 ' + kb + 'KB，但有 ' + r.miss.length + ' 张图缺失，页面会空图');
  }else{
    toast('发布文件已生成（' + kb + 'KB），把 cfg.js 发给 AI 助手即可上线');
  }
}
function copyCfg(){
  var r = buildCfgJs();
  try{
    navigator.clipboard.writeText(r.text).then(function(){ toast('配置已复制，粘到 cfg.js 里即可'); },
      function(){ toast('复制失败，用「导出配置」下载文件'); });
  }catch(e){ toast('复制失败，用「导出配置」下载文件'); }
}

function adminImg(k){
  if(!k) return '';
  if(/^(data:|https?:|\.\/|\/)/.test(k)) return k;
  if(k.charAt(0)==='@'){
    var key = k.slice(1);
    var local = '';
    try{ local = localStorage.getItem('gh_img_'+key) || ''; }catch(e){}
    if(local) return local;
    return (REMOTE_CFG.images && REMOTE_CFG.images[key]) || '';
  }
  return './assets/'+k+'.jpg';
}
function onLines(el, p){
  setPath(CFG_ED, p, el.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean));
  schedulePreview();
}

function pf(f){
  if(f.t==='note') return '<div class="cf-note" style="margin-bottom:12px">'+f.label+'</div>';
  var v = getPath(CFG_ED, f.p);
  if(v===undefined) v = '';

  if(f.t==='img')   return imgField(f, v);
  if(f.t==='pick')  return pickField(f, v);
  if(f.t==='quick') return quickField();

  var head = '<div class="cf"><label>'+f.label+'</label>';
  var tip = f.tip ? '<div class="cf-tip">'+f.tip+'</div>' : '';
  if(f.t==='lines'){
    return head + '<textarea rows="4" oninput="onLines(this,\''+f.p+'\')">'+esc((v||[]).join('\n'))+'</textarea>'+tip+'</div>';
  }
  if(f.t==='html' || f.t==='area'){
    return head + '<textarea rows="'+(f.t==='html'?2:3)+'" oninput="onCfg(this,\''+f.p+'\')">'+esc(v)+'</textarea>'+tip+'</div>';
  }
  return head + '<input value="'+esc(v)+'" placeholder="'+(f.tip?'':(f.ph||''))+'" oninput="onCfg(this,\''+f.p+'\')">'+tip+'</div>';
}

function imgField(f, v){
  var src = adminImg(v);
  var h = '<div class="cf"><label>'+f.label+'</label><div class="imgf">';
  h += '<div class="imgf-box">' + (src ? '<img src="'+src+'">' : '未设置') + '</div>';
  h += '<div class="imgf-act">';
  h += '<div style="display:flex;gap:7px">'
    +  '<button class="btn sm" onclick="pickImg(\''+f.p+'\')">上传图片</button>'
    +  (v ? '<button class="btn sm" onclick="clearImg(\''+f.p+'\')">清除</button>' : '')
    +  '</div>';
  if(f.tip) h += '<div class="cf-tip">'+f.tip+'</div>';
  h += '<div class="cf-tip">或用素材库：</div><div class="asset-row">';
  ASSETS.forEach(function(a){
    h += '<button class="asset-pick" title="'+a+'" onclick="setImg(\''+f.p+'\',\''+a+'\')">'
      +  '<img src="./assets/'+a+'.jpg" alt=""></button>';
  });
  h += '</div></div></div></div>';
  return h;
}

function pickField(f, v){
  var h = '<div class="cf"><label>'+f.label+'</label><select onchange="pickHero(this)">';
  var hit = false;
  WORKS.filter(function(w){ return w.status==='在售'; }).forEach(function(w){
    var sel = (w.id===v); if(sel) hit = true;
    h += '<option value="'+w.id+'"'+(sel?' selected':'')+'>'+w.no+' · '+w.t+' · '+w.spec+'</option>';
  });
  if(!hit) h += '<option value="" selected>（当前主推不在在售列表里）</option>';
  return h + '</select><div class="cf-tip">换主推 = 首页头图、标题、参数、价格一起换</div></div>';
}

function quickField(){
  var h = '<div class="cf"><label>分类快捷入口</label>';
  CFG_ED.quick.forEach(function(q, i){
    h += '<div class="qrow">'
      +  '<div class="qrow-img" onclick="pickImg(\'quick.'+i+'.img\')">'
      +    '<img src="'+adminImg(q.img)+'" alt=""><em>换图</em></div>'
      +  '<div style="flex:1;min-width:0">'
      +    '<input value="'+esc(q.label)+'" placeholder="名称，如 狮子头" oninput="setPath(CFG_ED,\'quick.'+i+'.label\',this.value);schedulePreview()">'
      +    '<select onchange="setQuick(this,'+i+')">';
    for(var ck in CFG_ED.cats){
      h += '<option value="'+ck+'|全部"'+(q.cat===ck && q.sub==='全部'?' selected':'')+'>'+CFG_ED.cats[ck].label+' · 全部</option>';
      CFG_ED.cats[ck].subs.forEach(function(s){
        if(s==='全部') return;
        var sel = (q.cat===ck && q.sub===s);
        h += '<option value="'+ck+'|'+s+'"'+(sel?' selected':'')+'>'+CFG_ED.cats[ck].label+' · '+s+'</option>';
      });
    }
    h += '</select></div></div>';
  });
  return h + '<div class="cf-tip">点左侧小图换图。名字和跳转都能改，四个位置固定。</div></div>';
}

function setQuick(el, i){
  var a = el.value.split('|');
  CFG_ED.quick[i].cat = a[0];
  CFG_ED.quick[i].sub = a[1];
  schedulePreview();
}
function setImg(p, name){
  setPath(CFG_ED, p, name);
  renderPages(); pushPreview();
  toast('图片已换成素材「'+name+'」，记得保存');
}

/* 图片上传：压到 1000px 内，存 localStorage，配置里只留一个 @key */
var imgTarget = null;
function pickImg(p){ imgTarget = p; var el=$('imgFile'); el.value=''; el.click(); }
function onImgFile(e){
  var f = e.target.files && e.target.files[0];
  if(!f || !imgTarget) return;
  var p = imgTarget;
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var max = 1000, w = im.width, h = im.height;
      if(w>max || h>max){ var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      var url = cv.toDataURL('image/jpeg', .82);
      var key = 'i' + Date.now().toString(36);
      var ok = true;
      try{ localStorage.setItem('gh_img_'+key, url); }catch(err){ ok = false; }
      setPath(CFG_ED, p, ok ? '@'+key : url);
      renderPages(); pushPreview();
      toast(ok ? '图片已换上，记得保存发布' : '本地空间不够，图片只是临时的');
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function clearImg(p){
  setPath(CFG_ED, p, '');
  renderPages(); pushPreview();
  toast('已清除，这块内容不再显示');
}

function resetPage(pk){
  var base = cfgClone();
  PAGE_META[pk].groups.forEach(function(g){
    g.fs.forEach(function(f){
      if(!f.p) return;
      var v = getPath(base, f.p);
      setPath(CFG_ED, f.p, v===undefined ? '' : JSON.parse(JSON.stringify(v)));
    });
  });
  renderPages(); pushPreview();
  toast('本页已恢复默认');
}

function renderPages(){
  if(!can('pages')){ $('content').innerHTML = '<div class="empty-row">当前账号没有权限</div>'; return; }
  var pk = S.pageKey || 'home';
  var meta = PAGE_META[pk];
  S.pageKey = pk;
  pvPage = PAGE_TABS.filter(function(t){ return t.k===pk; })[0].hash;

  var h = '<div class="pg-tabs">';
  PAGE_TABS.forEach(function(t){
    h += '<button class="pg-t'+(t.k===pk?' on':'')+'" onclick="S.pageKey=\''+t.k+'\';pvPage=\''+t.hash+'\';renderPages()">'+t.label+'</button>';
  });
  h += '</div>';

  h += '<div class="cfg-wrap"><div class="cfg-form">';
  h += '<div class="role-hint" style="margin-bottom:14px;max-width:none">'+meta.hint+'</div>';

  meta.groups.forEach(function(g){
    h += '<div class="card cfg-card"><div class="card-h"><h2>'+g.n+'</h2>'
      +  '<span class="r">改完自动进预览</span></div><div class="cfg-body">';
    if(g.n.indexOf('快捷')>-1 || g.n.indexOf('四个')>-1){
      h += pf(g.fs[0]);
    }else{
      var two = g.fs.length>2 && g.fs.every(function(f){ return f.t==='text'; });
      if(two){
        h += '<div class="cfg-2">';
        g.fs.forEach(function(f){ h += pf(f); });
        h += '</div>';
      }else{
        g.fs.forEach(function(f){ h += pf(f); });
      }
    }
    h += '</div></div>';
  });
  h += '</div>';

  /* 预览 */
  h += '<div class="cfg-prev"><div class="prev-card">'
    +  '<div class="prev-hd"><span>实时预览 · ' + (PAGE_TABS.filter(function(t){ return t.k===pk; })[0].label) + '</span>'
    +  '<span class="r">0.3 秒后刷新</span></div>'
    +  '<div class="prev-stage"><iframe id="pvFrame" scrolling="no"></iframe></div>'
    +  '<div class="prev-ft">'
    +  '<button class="btn primary" id="saveBtn" style="height:34px;flex:1" onclick="saveLocal()">保存</button>'
    +  '<button class="btn" style="height:34px" onclick="saveCfg()">本机草稿</button>'
    +  '<button class="btn primary" style="height:34px;background:#c0392b;border-color:#c0392b" onclick="exportCfg()">发布上线</button>'
    +  '</div>'
    +  '<div class="prev-ft" style="padding-top:0">'
    +  '<button class="btn" style="height:30px;flex:1" onclick="openCfg()">新窗口看</button>'
    +  '<button class="btn" style="height:30px;flex:1" onclick="resetPage(\''+pk+'\')">恢复本页默认</button>'
    +  '</div>'
    +  '<div class="prev-note">这个预览就是客户看到的样子，改一个字、换一张图，0.3 秒后就跟着变。满意了点「发布上线」生成 cfg.js，发给 AI 助手即可全设备生效。</div>'
    +  '</div></div>';

  h += '</div>';
  $('content').innerHTML = h;
  pushPreview();
  $('pageTitle').textContent = '页面管理 · ' + PAGE_TABS.filter(function(t){ return t.k===pk; })[0].label;
}

  $('todayPill').textContent = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';

  var q = new URLSearchParams(location.search);
